<!DOCTYPE html>
<html lang="en">

<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4168802109211914"
    crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Manager TT</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
</head>

<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">Stock Manager TT</a>
      <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="guides.html">Guides</a></li>
        <li><a href="faq.html">FAQs</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>
  <div class="container">
    <h1>Business Stock Manager</h1>

    <!-- Settings -->
    <div class="settings">
      <label>
        Low Stock Warning:
        <input type="number" id="stock-threshold" min="0" value="25" onchange="setLowStockThreshold()" />
      </label>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button> <a
          href="https://gist.github.com/Thesocialintrovert7/da415ce95653cdb003dd001ae736f70d/archive/33a9f63df67b33795872b4e54a7d8105473227e8.zip"
          download class="download-sample-btn">📥 Download Sample CSV</a></button>
      <button onclick="undoLastChange()">Undo Last Change</button>
      <button onclick="clearProductList()">Clear Product List</button>
      <button onclick="filterLowStock()">Show Low Stock</button>
      <button onclick="loadProducts()">Show All Products</button>
      <button onclick="exportToCSV()">Export to CSV</button>
      <label class="import-btn">
        Import from CSV
        <input type="file" accept=".csv" onchange="importFromCSV(event)" />
      </label>
      <button onclick="undoLastImport()">Undo Last Import</button>
    </div>

    <!-- Search Bar -->
    <div class="search-bar">
      <input type="text" id="search" placeholder="Search by product name or barcode..." />
    </div>

    <!-- Add Product Form -->
    <form id="product-form">
      <input type="text" id="name" placeholder="Product Name" required />
      <input type="text" id="barcode" placeholder="Barcode" required />
      <input type="number" id="quantity" placeholder="Quantity" min="0" required />
      <input type="number" id="price" placeholder="Price" min="0" step="0.01" required />

      <!-- Supplier Dropdown -->
      <select id="supplier" required>
        <option value="">Select Supplier</option>
      </select>

      <button type="submit">Add Product</button>
    </form>

    <!-- Add Supplier Section -->
    <div class="add-supplier">
      <h3>Add Supplier</h3>
      <input type="text" id="supplier-name" placeholder="Supplier Name" />
      <button onclick="addSupplier()">Add Supplier</button>
    </div>

    <!-- Low Stock Alert -->
    <div class="low-stock-alert" id="low-stock-alert"></div>

    <!-- Grand Total Summary -->
    <div class="grand-total-summary">
      <strong>Grand Total:</strong> <span id="grand-total">$0.00</span>
    </div>

    <!-- Product Table -->
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th>Supplier</th>
            <th>Barcode</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Price × Quantity</th>
            <th>Last Updated</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="product-list"></tbody>
      </table>
    </div>

    <!-- Back to Top Button -->
    <button id="backToTopBtn" title="Go to top">↑ Page Up</button>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js "></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js "></script>
  <script src="app.js"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4168802109211914"
    crossorigin="anonymous"></script>

  <!-- Service Worker for PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(() => console.log('Service Worker registered'))
          .catch(error => console.log('SW registration failed:', error));
      });
    }
  </script>s

</body>

</html>
